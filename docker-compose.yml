services:
  mongo:
    image: mongo:7
    container_name: aegis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - aegis-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override MONGO_URI so the backend talks to the mongo service,
      # not localhost (which doesn't exist inside the container).
      - MONGO_URI=mongodb://mongo:27017/aegis
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - aegis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  mongo-data: